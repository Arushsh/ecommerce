{% extends "app/base.html" %}
{% load static %}
{% block title %}Contact Us{% endblock title %}

{% block banner-slider %}
<div id="carouselExample" class="carousel slide">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{% static 'app/images/banner/b1.jpg' %}" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item">
        <img src="{% static 'app/images/banner/b2.jpg' %}" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item">
        <img src="{% static 'app/images/banner/b3.jpg' %}" class="d-block w-100" alt="...">
      </div>
      <div class="carousel-item">
        <img src="{% static 'app/images/banner/b4.jpg' %}" class="d-block w-100" alt="...">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
{% endblock banner-slider %}

{% block main-content %}
    <br>
<h1 class="text-center my-3">Contact Us</h1>
<br>
<div class="row container-fluid text-center ">
  <div >
    <h4 style="display: inline;">Call Now </h4><a href="tel:1234567890" class="btn btn-danger px-4">  <i class="fa-solid fa-phone fa-bounce"></i></a> 
  </div>

  <br>
  <div class="mt-4">
    <h4 style="display: inline;">Message </h4>
    <a href="tel:1234567890" class="btn btn-warning px-4"><i class="fa-solid fa-envelope fa-shake"></i></a>
  </div>

</div>
<br>
{% endblock main-content %}
